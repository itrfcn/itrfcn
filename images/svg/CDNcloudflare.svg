<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="101" height="20" role="img" aria-label="CDN: CloudFlare">
  <title>CDN: CloudFlare</title>
  <!-- 完全匹配原版的渐变定义 -->
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  
  <!-- 原版圆角裁剪（rx=3） -->
  <clipPath id="r">
    <rect width="101" height="20" rx="3" fill="#fff"/>
  </clipPath>
  
  <!-- 背景层（复刻原版分区比例+配色适配） -->
  <g clip-path="url(#r)">
    <rect width="32" height="20" fill="#555"/>          <!-- 左侧深色背景（匹配原版#555） -->
    <rect x="32" width="69" height="20" fill="#0066cc"/> <!-- 右侧蓝色背景（适配EdgeOne） -->
    <rect width="101" height="20" fill="url(#s)"/>      <!-- 渐变叠加层 -->
  </g>
  
  <!-- CDN 标志与文字层 -->
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <path aria-hidden="true" d="M2 14h6c1.2 0 2.2-.9 2.2-2s-1-2-2.2-2c-.5-1.7-2-2.8-3.7-2.8-1.7 0-3.1 1.1-3.6 2.6h-.2c-1.1 0-2 .9-2 2.1S-.6 14 2 14z" fill="#010101" fill-opacity=".3" transform="translate(1 0)"/>
    <path d="M2 13h6c1.2 0 2.2-.9 2.2-2s-1-2-2.2-2c-.5-1.7-2-2.8-3.7-2.8-1.7 0-3.1 1.1-3.6 2.6h-.2c-1.1 0-2 .9-2 2.1S-.6 13 2 13z" transform="translate(1 0)"/>
    <text aria-hidden="true" x="225" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="170">CDN</text>
    <text x="225" y="140" transform="scale(.1)" textLength="170">CDN</text>
    <text aria-hidden="true" x="745" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="430">CloudFlare</text>
    <text x="745" y="140" transform="scale(.1)" textLength="430">CloudFlare</text>
    
    <!-- 保留原版风格的轻量入场动画 -->
    <animateMotion path="M0,-3 L0,0" dur="0.25s" fill="freeze" begin="0s"/>
  </g>
</svg>