<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="20" role="img" aria-label="CDN: EdgeOne">
  <title>CDN: EdgeOne</title>
  <!-- 完全匹配原版的渐变定义 -->
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  
  <!-- 原版圆角裁剪（rx=3） -->
  <clipPath id="r">
    <rect width="96" height="20" rx="3" fill="#fff"/>
  </clipPath>
  
  <!-- 背景层（复刻原版分区比例+配色适配） -->
  <g clip-path="url(#r)">
    <rect width="40" height="20" fill="#555"/>          <!-- 左侧深色背景（匹配原版#555） -->
    <rect x="40" width="56" height="20" fill="#0066cc"/> <!-- 右侧蓝色背景（适配EdgeOne） -->
    <rect width="96" height="20" fill="url(#s)"/>      <!-- 渐变叠加层 -->
  </g>
  
  <!-- CDN 标志与文字层 -->
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <image x="4" y="3" width="14" height="14" xlink:href="data:image/svg+xml;base64,PHN2ZyBmaWxsPSJ3aGl0ZSIgdmlld0JveD0iMCAwIDI0IDI0IiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxwYXRoIGQ9Ik0zIDE4aDE0YzIuMiAwIDQtMS44IDQtNHMtMS44LTQtNC00Yy0uOC0yLjQtMy00LTUuNS00LTIuNCAwLTQuNSAxLjUtNS4zIDMuN0g2Yy0yLjIgMC00IDEuOC00IDRzLjggNC4zIDEgNC4zeiIvPjwvc3ZnPg=="/>
    <text aria-hidden="true" x="270" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="210">CDN</text>
    <text x="270" y="140" transform="scale(.1)" textLength="210">CDN</text>
    <text aria-hidden="true" x="680" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="500">EdgeOne</text>
    <text x="680" y="140" transform="scale(.1)" textLength="500">EdgeOne</text>
    
    <!-- 保留原版风格的轻量入场动画 -->
    <animateMotion path="M0,-3 L0,0" dur="0.25s" fill="freeze" begin="0s"/>
  </g>
</svg>